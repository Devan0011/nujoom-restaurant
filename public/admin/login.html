<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Nujoom Biriyani House</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #d4af37; font-size: 28px; }
    .logo span { color: #333; }
    h2 { text-align: center; margin-bottom: 30px; color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
    input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
    input:focus { outline: none; border-color: #d4af37; }
    button { width: 100%; padding: 14px; background: #d4af37; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #b8960c; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error { color: #e74c3c; text-align: center; margin-top: 15px; display: none; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #d4af37; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1><span>Nujoom</span> Admin</h1>
    </div>
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <p class="error" id="error"></p>
    </form>
    <div class="back-link">
      <a href="../index.html">&larr; Back to Website</a>
    </div>
  </div>
  <script>
    const API_BASE = window.location.origin + '/api';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('error');
      
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      error.style.display = 'none';

      const formData = new FormData(e.target);
      
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(formData))
        });
        
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', data.username);
          window.location.href = 'dashboard.html';
        } else {
          error.textContent = data.error || 'Login failed';
          error.style.display = 'block';
        }
      } catch (err) {
        error.textContent = 'Connection error. Please try again.';
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
