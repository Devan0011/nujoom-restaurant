<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="nujoom-api-base-url" content="">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Admin Login | Nujoom Biriyani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-utensils"></i>
        </div>
        <h1>Nujoom Admin</h1>
        <p>Sign in to manage your restaurant</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" required placeholder="admin@nujoom.com">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
            <button type="button" class="toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loading"><i class="fas fa-spinner fa-spin"></i> Signing in...</span>
        </button>
      </form>
      <div class="login-footer">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Website</a>
      </div>
    </div>
  </div>

  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: #141414;
      border-radius: 20px;
      padding: 50px 40px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #d4af37, #b8960c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .login-logo i {
      font-size: 36px;
      color: #0a0a0a;
    }

    .login-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #888;
      font-size: 14px;
    }

    .login-form .form-group {
      margin-bottom: 25px;
    }

    .login-form label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #b3b3b3;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 16px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 16px 50px 16px 50px;
      background: #0a0a0a;
      border: 2px solid #2a2a2a;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .input-wrapper input::placeholder {
      color: #555;
    }

    .toggle-password {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 0;
    }

    .toggle-password:hover {
      color: #d4af37;
    }

    .form-error {
      color: #f44336;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 20px;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #d4af37, #b8960c);
      border: none;
      border-radius: 12px;
      color: #0a0a0a;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }

    .btn-login .btn-loading {
      display: none;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .btn-login.loading .btn-loading {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .login-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #2a2a2a;
    }

    .login-footer a {
      color: #d4af37;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer a:hover {
      color: #f0d875;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 25px;
      }
    }
  </style>

  <script src="../js/config.js"></script>
  <script src="js/login.js" defer></script>
</body>
</html>
